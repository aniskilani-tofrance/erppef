# Déclencheur externe des SMS transactionnels aux restaurateurs.
#
# Pourquoi : depuis le passage en formule Vercel Pro, le cron de la plateforme appelle
# déjà ce point d'entrée tous les quarts d'heure. Cette action est un filet de sécurité,
# indépendant de Vercel : si la plateforme a une panne de crons, comme la nuit du 18 au
# 19 septembre 2026, les SMS partent quand même. Elle tourne donc toutes les deux heures,
# ce qui suffit à rattraper et reste dans les minutes offertes d'un dépôt privé.
#
# Le point d'entrée est idempotent : un message déjà envoyé n'est jamais renvoyé, et
# hors plage horaire il ne se passe rien. Un appel de trop est donc sans conséquence.
#
# Secret à créer dans le dépôt, sous Settings puis Secrets and variables puis Actions :
#   CRON_SECRET — la même valeur que la variable du même nom sur Vercel.

name: SMS des leads restaurateurs

on:
  schedule:
    - cron: "25 */2 * * *" # toutes les deux heures, heure UTC
  workflow_dispatch: # déclenchement manuel depuis l'onglet Actions

concurrency:
  group: leads-sms
  cancel-in-progress: false

jobs:
  declencher:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appeler le point d'entrée des SMS
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.ERP_BASE_URL || 'https://pef-erp.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Le secret CRON_SECRET n'est pas défini dans le dépôt."
            exit 1
          fi
          code=$(curl -sS -o reponse.json -w "%{http_code}" \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/leads-sms")
          echo "Réponse HTTP $code"
          cat reponse.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Le point d'entrée a répondu $code"
            exit 1
          fi

# Note d'exploitation : le dépôt local pousse vers deux distants, le dépôt de
# référence aniskilani-tofrance/erppef et un miroir privé aniskilani/erppef.
# Cette action n'est active que sur le dépôt de référence, qui porte le secret ;
# elle a été désactivée à la main sur le miroir le 19/09/2026, sans quoi elle y
# aurait échoué toutes les deux heures faute de secret, et aurait appelé l'ERP
# deux fois pour rien.
